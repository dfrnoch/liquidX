name: Build Mac DMG

# Reusable: builds the universal Release app with the given version, packs it in
# a DMG with an Applications shortcut and uploads it as the artifact
# `artifact_name`. Called by release.yml (nightly and production).
#
# With the four Developer ID secrets (docs/releasing.md) the app and the DMG are
# signed with the Developer ID, notarized and stapled. Without them the app is
# ad hoc signed and `notarized` is false, which the release notes then say.

on:
  workflow_call:
    inputs:
      marketing_version:
        description: MAJOR.MINOR.PATCH (CFBundleShortVersionString)
        required: true
        type: string
      build_number:
        description: Monotonic build number (CFBundleVersion)
        required: true
        type: string
      version_label:
        description: Full version shown to users, e.g. 0.1.0-nightly.20261104.12
        required: true
        type: string
      artifact_name:
        required: true
        type: string
      ref:
        description: Commit or tag to build (defaults to the calling ref)
        required: false
        type: string
        default: ''
    outputs:
      dmg_name:
        description: File name of the DMG inside the artifact
        value: ${{ jobs.build.outputs.dmg_name }}
      notarized:
        description: "'true' when signed with the Developer ID and notarized"
        value: ${{ jobs.build.outputs.notarized }}

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 60
    outputs:
      dmg_name: ${{ steps.names.outputs.dmg_name }}
      notarized: ${{ steps.signing.outputs.notarized }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Validate version inputs
        id: names
        env:
          MARKETING_VERSION: ${{ inputs.marketing_version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          VERSION_LABEL: ${{ inputs.version_label }}
        run: |
          set -euo pipefail
          [[ "$MARKETING_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$VERSION_LABEL" =~ ^[0-9A-Za-z.-]+$ && "$VERSION_LABEL" == "$MARKETING_VERSION"* ]]
          echo "dmg_name=LiquidX-$VERSION_LABEL.dmg" >> "$GITHUB_OUTPUT"
      - name: Import Developer ID
        id: signing
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$CERTIFICATE_BASE64$CERTIFICATE_PASSWORD$APPLE_ID$APPLE_APP_SPECIFIC_PASSWORD" ]]; then
            echo "::warning::No Developer ID secrets; building an ad hoc signed, unnotarized DMG."
            echo "notarized=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$CERTIFICATE_BASE64" || -z "$CERTIFICATE_PASSWORD" || -z "$APPLE_ID" || -z "$APPLE_APP_SPECIFIC_PASSWORD" ]]; then
            echo "::error::Set all four Developer ID secrets, or none (docs/releasing.md)."
            exit 1
          fi
          umask 077
          certificate="$RUNNER_TEMP/developer-id.p12"
          keychain="$RUNNER_TEMP/liquidx-signing.keychain-db"
          keychain_password=$(openssl rand -hex 32)
          echo "::add-mask::$keychain_password"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -P "$CERTIFICATE_PASSWORD" -k "$keychain" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm "$certificate"
          xcrun notarytool store-credentials LiquidX --keychain "$keychain" \
            --apple-id "$APPLE_ID" --team-id ZJ37A69485 --password "$APPLE_APP_SPECIFIC_PASSWORD"
          echo "notarized=true" >> "$GITHUB_OUTPUT"
      - name: Build and verify universal app
        env:
          MARKETING_VERSION: ${{ inputs.marketing_version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          VERSION_LABEL: ${{ inputs.version_label }}
          NOTARIZED: ${{ steps.signing.outputs.notarized }}
        run: |
          set -euo pipefail
          # Shared.xcconfig signs ad hoc; releases with secrets use the Developer ID.
          signing=()
          if [[ "$NOTARIZED" == true ]]; then
            signing=(CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=ZJ37A69485
              "CODE_SIGN_IDENTITY=Developer ID Application" OTHER_CODE_SIGN_FLAGS=--timestamp)
          fi
          xcodebuild -project LiquidX.xcodeproj -scheme LiquidX -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath build \
            MARKETING_VERSION="$MARKETING_VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            LIQUIDX_VERSION_LABEL="$VERSION_LABEL" ${signing[@]+"${signing[@]}"} build
          app=build/Build/Products/Release/LiquidX.app
          info="$app/Contents/Info.plist"
          [[ $(plutil -extract CFBundleShortVersionString raw "$info") == "$MARKETING_VERSION" ]]
          [[ $(plutil -extract CFBundleVersion raw "$info") == "$BUILD_NUMBER" ]]
          [[ $(plutil -extract LXVersionLabel raw "$info") == "$VERSION_LABEL" ]]
          codesign --verify --deep --strict "$app"
          if [[ "$NOTARIZED" == true ]]; then
            codesign --verify -R='identifier "dev.frnoch.liquidx" and anchor apple generic and certificate leaf[subject.OU] = "ZJ37A69485" and certificate leaf[field.1.2.840.113635.100.6.1.13] exists' "$app"
          fi
          architectures=$(lipo -archs "$app/Contents/MacOS/LiquidX")
          [[ " $architectures " == *" arm64 "* && " $architectures " == *" x86_64 "* ]]
      - name: Notarize app and create DMG
        env:
          DMG_NAME: ${{ steps.names.outputs.dmg_name }}
          VERSION_LABEL: ${{ inputs.version_label }}
          NOTARIZED: ${{ steps.signing.outputs.notarized }}
        run: |
          set -euo pipefail
          app=build/Build/Products/Release/LiquidX.app
          keychain="$RUNNER_TEMP/liquidx-signing.keychain-db"
          notarize() {
            xcrun notarytool submit "$1" --keychain-profile LiquidX --keychain "$keychain" \
              --wait --timeout 20m --output-format json > "$2"
            cat "$2"
            [[ $(plutil -extract status raw "$2") == Accepted ]]
          }
          if [[ "$NOTARIZED" == true ]]; then
            ditto -c -k --keepParent "$app" "$RUNNER_TEMP/LiquidX.zip"
            notarize "$RUNNER_TEMP/LiquidX.zip" "$RUNNER_TEMP/app-notarization.json"
            xcrun stapler staple "$app"
            xcrun stapler validate "$app"
            spctl --assess --type execute --verbose "$app"
          fi

          staging="$RUNNER_TEMP/dmg-staging"
          mkdir "$staging"
          ditto "$app" "$staging/LiquidX.app"
          ln -s /Applications "$staging/Applications"
          mkdir "$RUNNER_TEMP/dmg"
          dmg="$RUNNER_TEMP/dmg/$DMG_NAME"
          diskutil image create from --volumeName "LiquidX $VERSION_LABEL" --format UDZO "$staging" "$dmg"
          if [[ "$NOTARIZED" == true ]]; then
            codesign --sign 'Developer ID Application: David Frnoch (ZJ37A69485)' --timestamp "$dmg"
            codesign --verify --strict "$dmg"
            notarize "$dmg" "$RUNNER_TEMP/dmg-notarization.json"
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
            spctl --assess --type open --context context:primary-signature --verbose "$dmg"
          fi
          (cd "$RUNNER_TEMP/dmg" && shasum -a 256 "$DMG_NAME" > "$DMG_NAME.sha256")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ runner.temp }}/dmg/
          if-no-files-found: error
          retention-days: 7
      - name: Remove signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/developer-id.p12"
          if [[ -f "$RUNNER_TEMP/liquidx-signing.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/liquidx-signing.keychain-db"
          fi
