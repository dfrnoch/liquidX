name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package tests
    # Official preview image; see https://github.com/actions/runner-images/issues/14404.
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: swift test
        run: swift test --package-path Packages/LiquidKit

  macos:
    name: macOS app
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build universal Release app
        run: |
          xcodebuild -project LiquidX.xcodeproj -scheme LiquidX -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath build build
          codesign --verify --strict build/Build/Products/Release/LiquidX.app

  ios:
    name: iOS app and UI tests
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pick a simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Build and run UI tests
        run: |
          xcodebuild -project LiquidX.xcodeproj -scheme LiquidX \
            -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath build \
            -resultBundlePath build/tour.xcresult test
      - name: Export screenshots
        if: always()
        run: xcrun xcresulttool export attachments --path build/tour.xcresult --output-path build/tour || true
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: always()
        with:
          name: ui-tour
          path: build/tour
          if-no-files-found: ignore
